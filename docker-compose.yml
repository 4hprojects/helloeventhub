# Local development only. Single-node replica set so MongoDB transactions work like Atlas.
services:
  mongo:
    image: mongo:7.0
    command: ['--replSet', 'rs0', '--bind_ip_all', '--port', '27017']
    ports: ['127.0.0.1:27017:27017']
    volumes: ['heh-mongo:/data/db']
    healthcheck:
      test: >-
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s
volumes:
  heh-mongo:
